<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b7d9ec">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Foto da missão — José Lorenzo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg-baby: #b7d9ec;
      --blue-dark: #0a4ea3;
      --blue-mid: #1e6fd4;
      --blue-light: #5eb8ff;
      --red: #e63946;
      --red-dark: #c1121f;
      --yellow: #ffcc00;
      --silver: #d8d8d8;
      --white: #fff;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Nunito", Arial, sans-serif;
      background: var(--bg-baby);
      color: var(--blue-dark);
    }
    .page {
      max-width: 100%;
      margin: 0 auto;
      padding: 8px 0 24px;
    }
    .page-head,
    .camera-tools,
    .actions,
    .preview {
      padding-left: 12px;
      padding-right: 12px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.1rem;
      text-align: center;
      color: var(--red);
      text-transform: uppercase;
    }
    .hint {
      margin: 0 0 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
    }
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 629 / 896;
      margin: 0 0 10px;
      overflow: hidden;
      background: var(--bg-baby);
    }
    #video {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
    }
    #video.is-front {
      transform: scaleX(-1);
    }
    .frame-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 2;
    }
    .btn-flip {
      position: absolute;
      bottom: 24%;
      left: 4%;
      z-index: 5;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.35rem;
      line-height: 1;
      background: var(--white);
      border: 3px solid var(--yellow);
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .camera-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-tool {
      padding: 10px 8px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 900;
      color: var(--blue-dark);
      background: var(--white);
      border: 2px solid var(--blue-mid);
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-tool.is-active {
      color: var(--white);
      background: var(--blue-mid);
      border-color: var(--yellow);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 900;
      border-radius: 14px;
      border: 3px solid var(--yellow);
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-snap {
      color: var(--white);
      background: linear-gradient(180deg, var(--red), var(--red-dark));
      box-shadow: 0 4px 0 rgba(0,0,0,.2);
    }
    .btn-snap:active { transform: translateY(3px); box-shadow: none; }
    .btn-snap:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-back {
      color: var(--blue-dark);
      background: var(--white);
      border-color: var(--blue-mid);
    }
    .preview {
      display: none;
      margin-top: 12px;
      text-align: center;
    }
    .preview.is-visible { display: block; }
    .preview img {
      max-width: 100%;
      border-radius: 12px;
      border: 3px solid var(--yellow);
      box-shadow: 0 4px 16px rgba(10, 78, 163, 0.18);
    }
    .btn-download {
      margin-top: 8px;
      color: var(--white);
      background: linear-gradient(180deg, var(--blue-mid), var(--blue-dark));
    }
    .save-hint {
      display: none;
      margin: 8px 0 0;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--blue-dark);
      opacity: 0.9;
    }
    .preview.is-visible .save-hint { display: block; }
    .error {
      display: none;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      background: #fff3cd;
      border: 2px solid var(--yellow);
      border-radius: 10px;
    }
    .error.is-visible { display: block; }
    .upload-status {
      display: none;
      margin: 8px 0 0;
      padding: 8px 10px;
      font-size: 0.75rem;
      font-weight: 800;
      text-align: center;
      border-radius: 10px;
      line-height: 1.35;
    }
    .upload-status.is-visible { display: block; }
    .upload-status.is-info {
      color: var(--blue-dark);
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid var(--blue-mid);
    }
    .upload-status.is-ok {
      color: #0d5c2e;
      background: #d4edda;
      border: 2px solid #28a745;
    }
    .upload-status.is-warn {
      color: #856404;
      background: #fff3cd;
      border: 2px solid var(--yellow);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-head">
      <h1>📷 Foto da missão</h1>
      <p class="hint">Tire sua foto com a moldura especial da Patrulha Canina!</p>
      <p class="error" id="error"></p>
    </div>

    <div class="camera-tools">
      <button type="button" class="btn-tool is-active" id="btn-cam-back" data-mode="environment">📷 Traseira</button>
      <button type="button" class="btn-tool" id="btn-cam-front" data-mode="user">🤳 Frontal</button>
    </div>

    <div class="camera-box" id="camera-box">
      <video id="video" playsinline autoplay muted aria-label="Câmera"></video>
      <img
        id="frame-overlay"
        class="frame-overlay"
        src="assets/moldura-patrulha.png?v=8"
        alt=""
        aria-hidden="true"
        decoding="async"
      >
      <button type="button" class="btn-flip" id="btn-flip" aria-label="Trocar câmera" title="Trocar câmera">🔄</button>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-snap" id="btn-snap" disabled>📸 Tirar foto</button>
      <a class="btn btn-back" href="index.html">← Voltar ao convite</a>
    </div>

    <div class="preview" id="preview">
      <img id="preview-img" alt="Sua foto da missão">
      <button type="button" class="btn btn-download" id="btn-save">💾 Salvar na galeria</button>
      <p class="save-hint" id="save-hint">No iPhone: toque em <strong>Salvar imagem</strong>. No Android: escolha <strong>Fotos</strong> ou <strong>Galeria</strong>.</p>
      <p class="upload-status" id="upload-status" role="status" aria-live="polite"></p>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script>
    (function () {
      var video = document.getElementById("video");
      var canvas = document.getElementById("canvas");
      var btnSnap = document.getElementById("btn-snap");
      var btnFlip = document.getElementById("btn-flip");
      var btnCamBack = document.getElementById("btn-cam-back");
      var btnCamFront = document.getElementById("btn-cam-front");
      var preview = document.getElementById("preview");
      var previewImg = document.getElementById("preview-img");
      var btnSave = document.getElementById("btn-save");
      var saveHint = document.getElementById("save-hint");
      var uploadStatus = document.getElementById("upload-status");
      var lastPhotoBlob = null;
      var FOTO_WEBHOOK = {
        url: "https://n8n.zyxboot.com/webhook/lolo-foto-missao",
        secret: "lolo-jose-2026-zyx"
      };
      var errorEl = document.getElementById("error");
      var stream = null;
      var facingMode = "environment";

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("is-visible");
      }

      function setActiveCamButton() {
        var isFront = facingMode === "user";
        btnCamFront.classList.toggle("is-active", isFront);
        btnCamBack.classList.toggle("is-active", !isFront);
        video.classList.toggle("is-front", isFront);
      }

      function stopStream() {
        if (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          stream = null;
        }
      }

      var FRAME_SRC = "assets/moldura-patrulha.png?v=8";
      var FRAME_W = 629;
      var FRAME_H = 896;
      var VIDEO_FOCUS_Y = 0.4;
      var frameReady = false;
      var frameImage = new Image();
      frameImage.onload = function () {
        frameReady = frameImage.naturalWidth > 0;
      };
      frameImage.onerror = function () {
        frameReady = false;
      };
      frameImage.src = FRAME_SRC;

      function drawVideoCover(ctx, targetW, targetH, mirror) {
        var vw = video.videoWidth;
        var vh = video.videoHeight;
        if (!vw || !vh) return;

        var scale = Math.max(targetW / vw, targetH / vh);
        var sw = targetW / scale;
        var sh = targetH / scale;
        var sx = (vw - sw) / 2;
        var sy = (vh - sh) * VIDEO_FOCUS_Y;

        ctx.save();
        if (mirror) {
          ctx.translate(targetW, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
        ctx.restore();
      }

      function drawFrame(ctx, w, h) {
        if (!frameReady) return;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(frameImage, 0, 0, w, h);
      }

      function capturePhoto() {
        if (!video.videoWidth || !video.videoHeight) {
          showError("Aguarde a câmera iniciar e tente de novo.");
          return;
        }

        canvas.width = FRAME_W;
        canvas.height = FRAME_H;
        var ctx = canvas.getContext("2d");

        drawVideoCover(ctx, FRAME_W, FRAME_H, facingMode === "user");
        drawFrame(ctx, FRAME_W, FRAME_H);

        canvas.toBlob(function (blob) {
          if (!blob) return;
          lastPhotoBlob = blob;
          var dataUrl = URL.createObjectURL(blob);
          previewImg.src = dataUrl;
          preview.classList.add("is-visible");
          preview.scrollIntoView({ behavior: "smooth", block: "nearest" });

          var canShare = navigator.share && navigator.canShare && navigator.canShare({ files: [blobToFile(blob)] });
          btnSave.textContent = canShare ? "💾 Salvar na galeria" : "⬇ Baixar foto";
          saveHint.style.display = canShare ? "block" : "none";
          sendPhotoToParents(blob);
        }, "image/jpeg", 0.96);
      }

      function blobToFile(blob) {
        return new File([blob], "jose-lorenzo-missao.jpg", { type: "image/jpeg", lastModified: Date.now() });
      }

      function downloadBlob(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "jose-lorenzo-missao.jpg";
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }

      function setUploadStatus(message, kind) {
        uploadStatus.textContent = message;
        uploadStatus.className = "upload-status is-visible is-" + (kind || "info");
      }

      function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onloadend = function () { resolve(reader.result); };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function compressForUpload(blob) {
        return new Promise(function (resolve) {
          if (blob.size < 900000) {
            resolve(blob);
            return;
          }
          var img = new Image();
          var uploadCanvas = document.createElement("canvas");
          var objectUrl = URL.createObjectURL(blob);
          img.onload = function () {
            var maxW = 1200;
            var w = img.width;
            var h = img.height;
            if (w > maxW) {
              h = Math.round(h * (maxW / w));
              w = maxW;
            }
            uploadCanvas.width = w;
            uploadCanvas.height = h;
            var ctx = uploadCanvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(objectUrl);
            uploadCanvas.toBlob(function (smaller) {
              resolve(smaller || blob);
            }, "image/jpeg", 0.82);
          };
          img.onerror = function () {
            URL.revokeObjectURL(objectUrl);
            resolve(blob);
          };
          img.src = objectUrl;
        });
      }

      function sendPhotoToParents(blob) {
        setUploadStatus("Enviando foto aos pais no WhatsApp...", "info");

        compressForUpload(blob)
          .then(blobToBase64)
          .then(function (base64) {
            return fetch(FOTO_WEBHOOK.url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Webhook-Secret": FOTO_WEBHOOK.secret
              },
              body: JSON.stringify({
                image: base64,
                secret: FOTO_WEBHOOK.secret,
                caption: "📷 Nova foto da missão — Festa do José Lorenzo 🐾"
              })
            });
          })
          .then(function (res) {
            if (res && res.ok) {
              setUploadStatus("✅ Foto enviada aos pais no WhatsApp!", "ok");
              return;
            }
            throw new Error("upload_failed");
          })
          .catch(function () {
            try {
              var fd = new FormData();
              fd.append("photo", blob, "jose-lorenzo-missao.jpg");
              fd.append("secret", FOTO_WEBHOOK.secret);
              fd.append("caption", "📷 Nova foto da missão — Festa do José Lorenzo 🐾");
              if (navigator.sendBeacon && navigator.sendBeacon(FOTO_WEBHOOK.url, fd)) {
                setUploadStatus("✅ Foto enviada aos pais no WhatsApp!", "ok");
                return;
              }
            } catch (beaconErr) {
              /* ignore */
            }
            setUploadStatus("Não deu para enviar agora. Você ainda pode salvar a foto abaixo.", "warn");
          });
      }

      function saveToGallery() {
        if (!lastPhotoBlob) return;

        var file = blobToFile(lastPhotoBlob);
        var shareData = { files: [file], title: "Foto da missão — José Lorenzo" };

        if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
          navigator.share(shareData).catch(function (err) {
            if (err && err.name === "AbortError") return;
            downloadBlob(lastPhotoBlob);
          });
          return;
        }

        downloadBlob(lastPhotoBlob);
      }

      function startCamera(mode) {
        facingMode = mode || facingMode;
        setActiveCamButton();
        stopStream();
        btnSnap.disabled = true;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showError("Seu navegador não suporta câmera. Use Chrome ou Safari no celular.");
          return;
        }

        navigator.mediaDevices
          .getUserMedia({
            video: {
              facingMode: { exact: facingMode }
            },
            audio: false
          })
          .catch(function () {
            return navigator.mediaDevices.getUserMedia({
              video: { facingMode: facingMode },
              audio: false
            });
          })
          .then(function (s) {
            stream = s;
            video.srcObject = s;
            video.onloadedmetadata = function () {
              video.play().catch(function () {});
              btnSnap.disabled = false;
            };
            errorEl.classList.remove("is-visible");
          })
          .catch(function () {
            if (facingMode === "environment") {
              facingMode = "user";
              setActiveCamButton();
              return startCamera("user");
            }
            showError("Não foi possível abrir a câmera. Permita o acesso e recarregue a página.");
          });
      }

      function flipCamera() {
        startCamera(facingMode === "environment" ? "user" : "environment");
      }

      btnCamBack.addEventListener("click", function () { startCamera("environment"); });
      btnCamFront.addEventListener("click", function () { startCamera("user"); });
      btnFlip.addEventListener("click", flipCamera);

      btnSnap.addEventListener("click", capturePhoto);

      btnSave.addEventListener("click", saveToGallery);

      startCamera("environment");

      window.addEventListener("pagehide", function () {
        stopStream();
      });
    })();
  </script>
</body>
</html>
