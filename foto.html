<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b7d9ec">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Foto da missão — José Lorenzo (v2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg-baby: #b7d9ec;
      --blue-dark: #0a4ea3;
      --blue-mid: #1e6fd4;
      --blue-light: #5eb8ff;
      --red: #e63946;
      --red-dark: #c1121f;
      --yellow: #ffcc00;
      --silver: #d8d8d8;
      --white: #fff;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Nunito", Arial, sans-serif;
      background: var(--bg-baby);
      color: var(--blue-dark);
    }
    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 12px 10px 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.1rem;
      text-align: center;
      color: var(--red);
      text-transform: uppercase;
    }
    .hint {
      margin: 0 0 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
    }
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 62vh;
      margin: 0 auto 10px;
      border-radius: 20px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 8px 24px rgba(10, 78, 163, 0.22);
      border: 3px solid var(--yellow);
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #video.is-front {
      transform: scaleX(-1);
    }
    .frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .btn-flip {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.35rem;
      line-height: 1;
      background: var(--white);
      border: 3px solid var(--yellow);
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .camera-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-tool {
      padding: 10px 8px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 900;
      color: var(--blue-dark);
      background: var(--white);
      border: 2px solid var(--blue-mid);
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-tool.is-active {
      color: var(--white);
      background: var(--blue-mid);
      border-color: var(--yellow);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 900;
      border-radius: 14px;
      border: 3px solid var(--yellow);
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-snap {
      color: var(--white);
      background: linear-gradient(180deg, var(--red), var(--red-dark));
      box-shadow: 0 4px 0 rgba(0,0,0,.2);
    }
    .btn-snap:active { transform: translateY(3px); box-shadow: none; }
    .btn-snap:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-back {
      color: var(--blue-dark);
      background: var(--white);
      border-color: var(--blue-mid);
    }
    .preview {
      display: none;
      margin-top: 12px;
      text-align: center;
    }
    .preview.is-visible { display: block; }
    .preview img {
      max-width: 100%;
      border-radius: 12px;
      border: 3px solid var(--yellow);
      box-shadow: 0 4px 16px rgba(10, 78, 163, 0.18);
    }
    .btn-download {
      margin-top: 8px;
      color: var(--white);
      background: linear-gradient(180deg, var(--blue-mid), var(--blue-dark));
    }
    .save-hint {
      display: none;
      margin: 8px 0 0;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--blue-dark);
      opacity: 0.9;
    }
    .preview.is-visible .save-hint { display: block; }
    .error {
      display: none;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      background: #fff3cd;
      border: 2px solid var(--yellow);
      border-radius: 10px;
    }
    .error.is-visible { display: block; }
    .upload-status {
      display: none;
      margin: 8px 0 0;
      padding: 8px 10px;
      font-size: 0.75rem;
      font-weight: 800;
      text-align: center;
      border-radius: 10px;
      line-height: 1.35;
    }
    .upload-status.is-visible { display: block; }
    .upload-status.is-info {
      color: var(--blue-dark);
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid var(--blue-mid);
    }
    .upload-status.is-ok {
      color: #0d5c2e;
      background: #d4edda;
      border: 2px solid #28a745;
    }
    .upload-status.is-warn {
      color: #856404;
      background: #fff3cd;
      border: 2px solid var(--yellow);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>📷 Foto da missão</h1>
    <p class="hint">Tire sua foto com a moldura especial da Patrulha Canina!</p>

    <p class="error" id="error"></p>

    <div class="camera-tools">
      <button type="button" class="btn-tool is-active" id="btn-cam-back" data-mode="environment">📷 Traseira</button>
      <button type="button" class="btn-tool" id="btn-cam-front" data-mode="user">🤳 Frontal</button>
    </div>

    <div class="camera-box" id="camera-box">
      <video id="video" playsinline autoplay muted aria-label="Câmera"></video>
      <svg class="frame-svg" viewBox="0 0 100 133" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <pattern id="pawSide" width="10" height="14" patternUnits="userSpaceOnUse">
            <ellipse fill="#b7d9ec" cx="5" cy="9.5" rx="2.4" ry="1.8"/>
            <circle fill="#b7d9ec" cx="2.2" cy="6.2" r="1.1"/>
            <circle fill="#b7d9ec" cx="5" cy="5" r="1.1"/>
            <circle fill="#b7d9ec" cx="7.8" cy="6.2" r="1.1"/>
            <circle fill="#b7d9ec" cx="3.4" cy="3.2" r="0.95"/>
            <circle fill="#b7d9ec" cx="6.6" cy="3.2" r="0.95"/>
          </pattern>
        </defs>
        <!-- fundo lateral branco + patinhas azul bebê -->
        <rect x="0" y="0" width="11" height="133" fill="#fff"/>
        <rect x="89" y="0" width="11" height="133" fill="#fff"/>
        <rect x="0" y="0" width="11" height="133" fill="url(#pawSide)"/>
        <rect x="89" y="0" width="11" height="133" fill="url(#pawSide)"/>
        <!-- topo branco -->
        <path d="M11 0 H89 L89 22 Q50 26 11 22 Z" fill="#fff"/>
        <rect x="11" y="0" width="78" height="22" fill="#fff"/>
        <!-- ossinho -->
        <g transform="translate(50, 9)">
          <rect x="-26" y="-3.8" width="52" height="7.6" rx="3.8" fill="#fff" stroke="#0a4ea3" stroke-width="1"/>
          <circle cx="-26" cy="0" r="7.2" fill="#fff" stroke="#0a4ea3" stroke-width="1"/>
          <circle cx="26" cy="0" r="7.2" fill="#fff" stroke="#0a4ea3" stroke-width="1"/>
          <text x="0" y="1.8" text-anchor="middle" fill="#e63946" font-size="5.2" font-weight="900" font-family="Nunito,Arial,sans-serif">José Lorenzo</text>
        </g>
        <text x="50" y="19" text-anchor="middle" fill="#0a4ea3" font-size="4.2" font-weight="800" font-style="italic" font-family="Nunito,Arial,sans-serif">Patrulha Canina 🐾</text>
        <!-- cantos decorativos -->
        <text x="14" y="8" font-size="6">🐕‍🦺</text>
        <text x="82" y="8" font-size="6">👦</text>
        <!-- base branca -->
        <rect x="0" y="104" width="100" height="29" fill="#fff"/>
        <rect x="11" y="104" width="78" height="2" fill="#ffcc00"/>
        <rect x="11" y="106" width="78" height="1" fill="#0a4ea3" opacity="0.35"/>
        <!-- fila dos cães (emojis) -->
        <text x="50" y="122" text-anchor="middle" font-size="9">🩷 🚒 🐕 🚓 🚁</text>
        <text x="50" y="130" text-anchor="middle" fill="#0a4ea3" font-size="3.6" font-weight="900" font-family="Nunito,Arial,sans-serif">MISSÃO CUMPRIDA</text>
        <!-- moldura fina nas cores do convite -->
        <rect x="0.6" y="0.6" width="98.8" height="131.8" rx="5" fill="none" stroke="#ffcc00" stroke-width="1.4"/>
        <rect x="2" y="2" width="96" height="129" rx="4" fill="none" stroke="#0a4ea3" stroke-width="0.8" opacity="0.45"/>
      </svg>
      <button type="button" class="btn-flip" id="btn-flip" aria-label="Trocar câmera" title="Trocar câmera">🔄</button>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-snap" id="btn-snap" disabled>📸 Tirar foto</button>
      <a class="btn btn-back" href="index.html">← Voltar ao convite</a>
    </div>

    <div class="preview" id="preview">
      <img id="preview-img" alt="Sua foto da missão">
      <button type="button" class="btn btn-download" id="btn-save">💾 Salvar na galeria</button>
      <p class="save-hint" id="save-hint">No iPhone: toque em <strong>Salvar imagem</strong>. No Android: escolha <strong>Fotos</strong> ou <strong>Galeria</strong>.</p>
      <p class="upload-status" id="upload-status" role="status" aria-live="polite"></p>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script>
    (function () {
      var video = document.getElementById("video");
      var canvas = document.getElementById("canvas");
      var btnSnap = document.getElementById("btn-snap");
      var btnFlip = document.getElementById("btn-flip");
      var btnCamBack = document.getElementById("btn-cam-back");
      var btnCamFront = document.getElementById("btn-cam-front");
      var preview = document.getElementById("preview");
      var previewImg = document.getElementById("preview-img");
      var btnSave = document.getElementById("btn-save");
      var saveHint = document.getElementById("save-hint");
      var uploadStatus = document.getElementById("upload-status");
      var lastPhotoBlob = null;
      var FOTO_WEBHOOK = {
        url: "https://n8n.zyxboot.com/webhook/lolo-foto-missao",
        secret: "lolo-jose-2026-zyx"
      };
      var errorEl = document.getElementById("error");
      var stream = null;
      var facingMode = "environment";

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("is-visible");
      }

      function setActiveCamButton() {
        var isFront = facingMode === "user";
        btnCamFront.classList.toggle("is-active", isFront);
        btnCamBack.classList.toggle("is-active", !isFront);
        video.classList.toggle("is-front", isFront);
      }

      function stopStream() {
        if (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          stream = null;
        }
      }

      var FRAME = {
        bgBaby: "#b7d9ec",
        blueDark: "#0a4ea3",
        blueMid: "#1e6fd4",
        red: "#e63946",
        yellow: "#ffcc00",
        white: "#ffffff"
      };

      function drawMiniPaw(ctx, x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = FRAME.bgBaby;
        ctx.beginPath();
        ctx.ellipse(0, 3.2, 4.8, 3.6, 0, 0, Math.PI * 2);
        ctx.fill();
        [[-4.4, 0.4], [0, -1.2], [4.4, 0.4], [-2.4, -4.2], [2.4, -4.2]].forEach(function (p) {
          ctx.beginPath();
          ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawPawColumn(ctx, x, yStart, yEnd, step) {
        for (var y = yStart; y < yEnd; y += step) {
          drawMiniPaw(ctx, x, y, 1);
        }
      }

      function drawBone(ctx, cx, cy, w) {
        var barW = w * 0.52;
        var barH = w * 0.076;
        var r = w * 0.144;
        ctx.fillStyle = FRAME.white;
        ctx.strokeStyle = FRAME.blueDark;
        ctx.lineWidth = w * 0.02;

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(cx - barW / 2, cy - barH / 2, barW, barH, barH / 2);
        } else {
          ctx.rect(cx - barW / 2, cy - barH / 2, barW, barH);
        }
        ctx.fill();
        ctx.stroke();

        [[cx - barW / 2, cy], [cx + barW / 2, cy]].forEach(function (p) {
          ctx.beginPath();
          ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
      }

      function drawFrame(ctx, w, h) {
        var sx = w / 100;
        var sy = h / 133;
        ctx.save();
        ctx.scale(sx, sy);

        ctx.fillStyle = FRAME.white;
        ctx.fillRect(0, 0, 11, 133);
        ctx.fillRect(89, 0, 11, 133);
        ctx.fillRect(11, 0, 78, 22);
        ctx.fillRect(0, 104, 100, 29);

        drawPawColumn(ctx, 5.5, 6, 128, 14);
        drawPawColumn(ctx, 94.5, 6, 128, 14);

        drawBone(ctx, 50, 9, 52);

        ctx.textAlign = "center";
        ctx.fillStyle = FRAME.red;
        ctx.font = "900 5.2px Nunito, Arial, sans-serif";
        ctx.fillText("José Lorenzo", 50, 10.8);

        ctx.fillStyle = FRAME.blueDark;
        ctx.font = "italic 800 4.2px Nunito, Arial, sans-serif";
        ctx.fillText("Patrulha Canina 🐾", 50, 19);

        ctx.font = "6px Arial";
        ctx.fillText("🐕‍🦺", 14, 8);
        ctx.fillText("👦", 82, 8);

        ctx.fillStyle = FRAME.yellow;
        ctx.fillRect(11, 104, 78, 2);
        ctx.fillStyle = "rgba(10, 78, 163, 0.35)";
        ctx.fillRect(11, 106, 78, 1);

        ctx.font = "9px Arial";
        ctx.fillText("🩷 🚒 🐕 🚓 🚁", 50, 122);

        ctx.fillStyle = FRAME.blueDark;
        ctx.font = "900 3.6px Nunito, Arial, sans-serif";
        ctx.fillText("MISSÃO CUMPRIDA", 50, 130);

        ctx.strokeStyle = FRAME.yellow;
        ctx.lineWidth = 1.4;
        ctx.strokeRect(0.6, 0.6, 98.8, 131.8);
        ctx.strokeStyle = "rgba(10, 78, 163, 0.45)";
        ctx.lineWidth = 0.8;
        ctx.strokeRect(2, 2, 96, 129);

        ctx.restore();
      }

      function blobToFile(blob) {
        return new File([blob], "jose-lorenzo-missao.jpg", { type: "image/jpeg", lastModified: Date.now() });
      }

      function downloadBlob(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "jose-lorenzo-missao.jpg";
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      }

      function setUploadStatus(message, kind) {
        uploadStatus.textContent = message;
        uploadStatus.className = "upload-status is-visible is-" + (kind || "info");
      }

      function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onloadend = function () { resolve(reader.result); };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function compressForUpload(blob) {
        return new Promise(function (resolve) {
          if (blob.size < 900000) {
            resolve(blob);
            return;
          }
          var img = new Image();
          var objectUrl = URL.createObjectURL(blob);
          img.onload = function () {
            var maxW = 1200;
            var w = img.width;
            var h = img.height;
            if (w > maxW) {
              h = Math.round(h * (maxW / w));
              w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(objectUrl);
            canvas.toBlob(function (smaller) {
              resolve(smaller || blob);
            }, "image/jpeg", 0.82);
          };
          img.onerror = function () {
            URL.revokeObjectURL(objectUrl);
            resolve(blob);
          };
          img.src = objectUrl;
        });
      }

      function sendPhotoToParents(blob) {
        setUploadStatus("Enviando foto aos pais no WhatsApp...", "info");

        compressForUpload(blob)
          .then(blobToBase64)
          .then(function (base64) {
            return fetch(FOTO_WEBHOOK.url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Webhook-Secret": FOTO_WEBHOOK.secret
              },
              body: JSON.stringify({
                image: base64,
                secret: FOTO_WEBHOOK.secret,
                caption: "📷 Nova foto da missão — Festa do José Lorenzo 🐾"
              })
            });
          })
          .then(function (res) {
            if (res && res.ok) {
              setUploadStatus("✅ Foto enviada aos pais no WhatsApp!", "ok");
              return;
            }
            throw new Error("upload_failed");
          })
          .catch(function () {
            try {
              var fd = new FormData();
              fd.append("photo", blob, "jose-lorenzo-missao.jpg");
              fd.append("secret", FOTO_WEBHOOK.secret);
              fd.append("caption", "📷 Nova foto da missão — Festa do José Lorenzo 🐾");
              if (navigator.sendBeacon && navigator.sendBeacon(FOTO_WEBHOOK.url, fd)) {
                setUploadStatus("✅ Foto enviada aos pais no WhatsApp!", "ok");
                return;
              }
            } catch (beaconErr) {
              /* ignore */
            }
            setUploadStatus("Não deu para enviar agora. Você ainda pode salvar a foto abaixo.", "warn");
          });
      }

      function saveToGallery() {
        if (!lastPhotoBlob) return;

        var file = blobToFile(lastPhotoBlob);
        var shareData = { files: [file], title: "Foto da missão — José Lorenzo" };

        if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
          navigator.share(shareData).catch(function (err) {
            if (err && err.name === "AbortError") return;
            downloadBlob(lastPhotoBlob);
          });
          return;
        }

        downloadBlob(lastPhotoBlob);
      }

      function startCamera(mode) {
        facingMode = mode || facingMode;
        setActiveCamButton();
        stopStream();
        btnSnap.disabled = true;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showError("Seu navegador não suporta câmera. Use Chrome ou Safari no celular.");
          return;
        }

        navigator.mediaDevices
          .getUserMedia({
            video: {
              facingMode: { exact: facingMode }
            },
            audio: false
          })
          .catch(function () {
            return navigator.mediaDevices.getUserMedia({
              video: { facingMode: facingMode },
              audio: false
            });
          })
          .then(function (s) {
            stream = s;
            video.srcObject = s;
            btnSnap.disabled = false;
            errorEl.classList.remove("is-visible");
          })
          .catch(function () {
            if (facingMode === "environment") {
              facingMode = "user";
              setActiveCamButton();
              return startCamera("user");
            }
            showError("Não foi possível abrir a câmera. Permita o acesso e recarregue a página.");
          });
      }

      function flipCamera() {
        startCamera(facingMode === "environment" ? "user" : "environment");
      }

      btnCamBack.addEventListener("click", function () { startCamera("environment"); });
      btnCamFront.addEventListener("click", function () { startCamera("user"); });
      btnFlip.addEventListener("click", flipCamera);

      btnSnap.addEventListener("click", function () {
        var w = video.videoWidth;
        var h = video.videoHeight;
        if (!w || !h) return;

        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");

        if (facingMode === "user") {
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, w, h);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
        } else {
          ctx.drawImage(video, 0, 0, w, h);
        }

        drawFrame(ctx, w, h);

        canvas.toBlob(function (blob) {
          if (!blob) return;
          lastPhotoBlob = blob;
          var dataUrl = URL.createObjectURL(blob);
          previewImg.src = dataUrl;
          preview.classList.add("is-visible");
          preview.scrollIntoView({ behavior: "smooth", block: "nearest" });

          var canShare = navigator.share && navigator.canShare && navigator.canShare({ files: [blobToFile(blob)] });
          btnSave.textContent = canShare ? "💾 Salvar na galeria" : "⬇ Baixar foto";
          saveHint.style.display = canShare ? "block" : "none";
          sendPhotoToParents(blob);
        }, "image/jpeg", 0.92);
      });

      btnSave.addEventListener("click", saveToGallery);

      startCamera("environment");

      window.addEventListener("pagehide", function () {
        stopStream();
      });
    })();
  </script>
</body>
</html>
